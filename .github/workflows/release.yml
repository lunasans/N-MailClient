name: Build & Release

# Baut bei jedem Tag v* die eigenstaendige EXE und das Inno-Setup und
# veroeffentlicht beides als GitHub-Release.
#
# Die eigentliche Arbeit macht installer\build.ps1 — dasselbe Skript wie lokal.
# Doppelte Bauschritte hier waeren sonst die naechste Stelle, die auseinanderlaeuft.
#
# Signieren: die Secrets CSC_LINK_BASE64 (Base64 einer .pfx) und
# CSC_KEY_PASSWORD stammen noch aus der Electron-Zeit — daher die
# electron-builder-Namen. Sind sie gesetzt, wandert das Zertifikat in den
# Speicher des Runners und build.ps1 signiert damit; fehlen sie, baut der Lauf
# unsigniert weiter.
#
# Zur Einordnung: das Zertifikat ist selbstsigniert. Die Electron-Fassung hat
# deshalb bewusst gar nicht signiert (»sammelt keine SmartScreen-Reputation und
# loest nur zusaetzliche Warnungen aus«). Hier wird signiert, damit CI und
# lokaler build.ps1 dasselbe Ergebnis liefern. Die SmartScreen-Warnung
# verschwindet dadurch nicht — dafuer braucht es ein Zertifikat aus einer
# anerkannten Kette; zu wechseln ist dann nur der Inhalt der Secrets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: .NET einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Der Tag ist die Ankuendigung nach aussen, die Projektdatei die Quelle
      # der Version. Laufen sie auseinander, traegt das Setup eine andere Zahl
      # als das Release — lieber hier abbrechen als es hinterher zu erklaeren.
      - name: Version gegen Tag pruefen
        shell: pwsh
        run: |
          $projekt = "NMailClient\NMailClient.csproj"
          $version = ([xml](Get-Content $projekt -Raw)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          $tag = "${{ github.ref_name }}" -replace '^v', ''

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $version -ne $tag) {
            throw "Tag v$tag und <Version> $version in $projekt stimmen nicht ueberein."
          }
          Write-Host "Version $version"
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      - name: Zertifikat importieren (falls hinterlegt)
        id: cert
        shell: pwsh
        env:
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK_BASE64) {
            Write-Host "Kein CSC_LINK_BASE64 hinterlegt - es wird unsigniert gebaut."
            "thumbprint=" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $pfad = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfad, [Convert]::FromBase64String($env:CSC_LINK_BASE64))

          $pass = ConvertTo-SecureString $env:CSC_KEY_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfad `
                    -CertStoreLocation Cert:\CurrentUser\My -Password $pass

          # Die Datei wird nicht mehr gebraucht; der Runner ist zwar fluechtig,
          # aber ein privater Schluessel muss nicht laenger herumliegen als noetig.
          Remove-Item $pfad -Force

          Write-Host "Zertifikat importiert: $($cert.Subject)"
          "thumbprint=$($cert.Thumbprint)" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Bauen, signieren, Setup erzeugen
        shell: pwsh
        run: |
          $tp = "${{ steps.cert.outputs.thumbprint }}"
          if ($tp) {
            .\installer\build.ps1 -Thumbprint $tp
          } else {
            .\installer\build.ps1 -SkipSign
          }

      # Ohne Tag gibt es nichts zu veroeffentlichen: ein Release haengt an einem
      # Tag, und ein Probelauf per workflow_dispatch soll gerade keinen anlegen.
      # Die Dateien kommen stattdessen als Artefakt heraus — sonst waere ein
      # Probelauf zwar gruen, brächte aber nichts zum Nachsehen.
      - name: Ergebnis als Artefakt ablegen (Laeufe ohne Tag)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: NMailClient-Probelauf
          path: |
            publish/NMailClient-*-setup.exe
            publish/standalone/NMailClient.exe

      # generate_release_notes allein liefert hier nichts: es zaehlt gemergte
      # Pull Requests auf, und in diesem Repo wird direkt auf main committet.
      # Uebrig bliebe die blosse Vergleichs-URL. Der Text steht deshalb in der
      # annotierten Tag-Nachricht - dort, wo beim Taggen ohnehin beschrieben
      # wird, was die Version ausmacht.
      - name: Release-Text aus der Tag-Nachricht holen
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

          # %(contents) ist der Teil nach der Betreffzeile; die Signatur eines
          # signierten Tags gehoerte nicht in den Text.
          {
            echo 'NOTES<<TAGTEXT_EOF'
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${{ github.ref_name }}"
            echo 'TAGTEXT_EOF'
          } >> "$GITHUB_ENV"

      - name: Release erstellen und Assets hochladen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ env.NOTES }}
          # Haengt die Vergleichs-URL unter den Text aus der Tag-Nachricht.
          generate_release_notes: true
          files: |
            publish/NMailClient-*-setup.exe
            publish/standalone/NMailClient.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Muss angestossen werden statt zu lauschen: der Release oben entsteht mit
      # GITHUB_TOKEN, und daraus folgende Ereignisse starten keine weiteren
      # Workflows. Der Anstoss braucht deshalb den PAT, nicht GITHUB_TOKEN —
      # mit dem waere er derselben Sperre unterworfen.
      - name: winget-Einreichung anstossen
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # Der secrets-Kontext steht in `if:` auf Schritt-Ebene nicht zur
          # Verfuegung, die Pruefung muss also hierher.
          if [ -z "$GH_TOKEN" ]; then
            echo "Kein WINGET_TOKEN hinterlegt - winget-Einreichung uebersprungen."
            exit 0
          fi

          gh workflow run winget.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --field tag="${{ github.ref_name }}"
